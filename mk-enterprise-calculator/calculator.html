<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111">
<title>M & K Enterprise Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}.splash{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity .4s}.splash img{width:min(78vw,360px);height:auto;border-radius:18px}.loader{width:180px;height:4px;background:#333;border-radius:9px;overflow:hidden;margin-top:22px}.loader i{display:block;width:45%;height:100%;background:#e11;border-radius:9px;animation:load 1.1s infinite}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}.app{max-width:560px;margin:auto;padding:18px}.head{background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center}.logo{font-size:27px;font-weight:800}.logo b{color:#e11}.sub{opacity:.8;font-size:13px}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 5px 20px #0001}label{display:block;font-weight:700;margin:9px 0 5px}input,select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{border:0;background:#111;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foldrow{display:flex;gap:8px;align-items:center}.foldrow input{flex:1;text-align:center}.foldbtn{width:52px;padding:12px 8px;margin:0;font-size:22px}.checkrow{display:flex;align-items:center;gap:10px;margin-top:9px;padding:10px 12px;background:#f7f7f7;border-radius:10px;font-weight:700}.checkrow input{width:20px;height:20px;margin:0;accent-color:#111}.result{font-size:26px;font-weight:800}.muted{color:#666}.copy{white-space:pre-wrap;background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7}.green{background:#087f5b}.wa{background:#168c45}.hint{font-size:12px;color:#777;margin-top:5px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#087f5b;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9999}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="splash" id="splash"><img src="logo.jpg" alt="M & K Enterprise"><div class="loader"><i></i></div></div>
<div class="app">
<div class="head"><div class="logo">M <b>&</b> K Enterprise</div><div class="sub">Poly Bag Price Calculator</div></div>
<div class="card">
<div class="grid">
<div><label>Width (inch)</label><input id="w" type="number" value="14" step=".01" min="0"></div>
<div><label>Length (inch)</label><input id="l" type="number" value="18" step=".01" min="0"></div>
<div><label>Thickness (mm)</label><input id="t" type="number" value="17" step=".01" min="0"></div>
<div><label>Folding (inch)</label><div class="foldrow"><button class="foldbtn" id="minusFold" type="button" onclick="changeFold(-1)">−</button><input id="fold" type="number" value="3" step="1" min="0" max="6"><button class="foldbtn" id="plusFold" type="button" onclick="changeFold(1)">+</button></div><div class="hint">Folding: 3, 4, 5, 6 inch অথবা নিজের মতো value দিন</div><div class="checkrow"><input id="noFold" type="checkbox"><span>Folding ছাড়া</span></div></div>
</div>
<label>Pound rate (Tk/lb) — editable</label><input id="pound" type="number" value="120" step=".01" min="0">
<label>Handle</label><select id="handle"><option value="d">ডি-কাট হেন্ডেল</option><option value="t">তোরা হেন্ডেল</option></select>
<div id="hb" style="display:none"><label>তোরা হেন্ডেল charge (Tk/pc)</label><input id="hc" type="number" value="0" step=".01" min="0"></div>
<label>Print</label><select id="print"><option value=".60">১ কালার (উভয় পাশে)</option><option value="1">২ কালার (উভয় পাশে)</option></select>
<label>Print charge (Tk/pc) — editable</label><input id="pc" type="number" value=".60" step=".01" min="0">
<label>Block</label><select id="block"><option value="0">কোনো Block নেই</option><option value="1.50">১ কালার Block</option><option value="1">২ কালার Block</option></select>
<label>Block charge (Tk/pc) — editable</label><input id="bc" type="number" value="0" step=".01" min="0">
<label>Profit (Tk/pc) — editable</label><input id="profit" type="number" value="1" step=".01" min="0">
<label>Minimum order (pcs) — editable</label><input id="qty" type="number" value="2000" min="0">
<button onclick="calc()">Calculate Price</button>
</div>
<div class="card"><div class="muted">Price per piece</div><div class="result" id="price">৳0.00</div><div id="bd" class="muted"></div><button class="green" id="copyBtn" onclick="copyText()">Copy Customer Text</button><button class="wa" onclick="wa()">WhatsApp</button></div>
<div class="card"><b>Customer Copy</b><div id="customer" class="copy"></div></div>
</div>
<div id="toast" class="toast">✓ Text copied successfully</div>
<script>
const $=x=>document.getElementById(x),bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),fmt=x=>Number(x||0).toFixed(2);
function changeFold(step){let el=$('fold');if($('noFold').checked)return;let v=parseFloat(el.value);if(!Number.isFinite(v))v=3;v=Math.max(0,Math.min(6,v+step));el.value=Number(v.toFixed(2));calc()}
function syncFoldState(){let off=$('noFold').checked;$('fold').disabled=off;$('minusFold').disabled=off;$('plusFold').disabled=off;if(off)$('fold').value=0;else if(+$('fold').value===0)$('fold').value=3;calc()}
function calc(){let w=+$('w').value,l=+$('l').value,t=+$('t').value,f=$('noFold').checked?0:Math.max(0,Math.min(6,+$('fold').value||0)),pound=Math.max(0,+$('pound').value||0);if(w<=0||l<=0||t<=0){$('price').textContent='৳0.00';return}let ppl=75000/((w+f)*l*t),raw=pound/ppl,pr=Math.max(0,+$('pc').value||0),bl=Math.max(0,+$('bc').value||0),h=$('handle').value==='t'?Math.max(0,+$('hc').value||0):0,profit=Math.max(0,+$('profit').value||0),total=raw+pr+bl+h+profit;$('price').textContent='৳'+fmt(total);$('bd').innerHTML=`Pcs/lb: ${fmt(ppl)}<br>Pound rate: ৳${fmt(pound)}/lb<br>Raw material: ৳${fmt(raw)}<br>Print: ৳${fmt(pr)}<br>Block: ৳${fmt(bl)}<br>Handle: ৳${fmt(h)}<br>Profit: ৳${fmt(profit)}`;let ft=f===0?'ছাড়া':bn(f)+' ইঞ্চি',ht=$('handle').value==='t'?'তোরা হেন্ডেল':'ডি-কাট হেন্ডেল',pt=$('print').value==='.60'?'১ কালার (উভয় পাশে)':'২ কালার (উভয় পাশে)',qty=Math.max(0,+$('qty').value||0);window.txt=`প্রস্থ/Width=  ${bn(w)} ইঞ্চি\nদৈঘ্য/ length=  ${bn(l)} ইঞ্চি\nগেজেট / Folding=  ${ft}\n${ht}\n${pt}\nসর্বনিম্ন অর্ডার ${bn(qty)} পিস \nথিকনেস= ${bn(t)} mm\n\nদাম = ${bn(fmt(total))} টাকা পার পিস`;$('customer').textContent=window.txt}
async function copyText(){calc();try{await navigator.clipboard.writeText(window.txt);showToast();let b=$('copyBtn'),old=b.textContent;b.textContent='✓ Copied Successfully';setTimeout(()=>b.textContent=old,1600)}catch(e){showToast('Copy failed — please try again')}}
function showToast(msg='✓ Text copied successfully'){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function wa(){calc();location.href='https://wa.me/?text='+encodeURIComponent(window.txt)}
$('handle').onchange=()=>{$('hb').style.display=$('handle').value==='t'?'block':'none';calc()};$('print').onchange=()=>{$('pc').value=$('print').value;$('qty').value=$('print').value==='.60'?2000:3000;calc()};$('block').onchange=()=>{$('bc').value=$('block').value;calc()};$('noFold').onchange=syncFoldState;['w','l','t','fold','pound','hc','pc','bc','profit','qty'].forEach(id=>$(id).addEventListener('input',calc));calc();setTimeout(()=>{let s=$('splash');s.style.opacity='0';setTimeout(()=>s.remove(),450)},1400);
</script>
</body></html>
