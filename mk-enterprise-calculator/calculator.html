<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M & K Enterprise Calculator</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}.app{max-width:560px;margin:auto;padding:18px}.head{background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center}.logo{font-size:27px;font-weight:800}.logo b{color:#e11}.sub{opacity:.8;font-size:13px}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 5px 20px #0001}label{display:block;font-weight:700;margin:9px 0 5px}input,select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box;transition:.2s ease}input:focus{outline:none;border-color:#13a9e8;box-shadow:0 0 0 3px #13a9e81f;background:#fbfeff}select{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.dropdown{position:relative;width:100%}.drop-trigger{width:100%;min-height:47px;padding:12px 42px 12px 14px;border:1px solid #d8dee4;border-radius:10px;background:#fff;color:#111;text-align:left;font-size:16px;cursor:pointer;position:relative;transition:.2s ease}.drop-trigger:after{content:'⌄';position:absolute;right:14px;top:50%;transform:translateY(-55%);font-size:21px;color:#68737d;transition:.2s}.dropdown.open .drop-trigger{border-color:#13a9e8;box-shadow:0 0 0 3px #13a9e81f}.dropdown.open .drop-trigger:after{transform:translateY(-45%) rotate(180deg);color:#13a9e8}.drop-trigger:hover{border-color:#13a9e8;box-shadow:0 4px 12px #0001}.drop-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #dfe5ea;border-radius:12px;padding:6px;box-shadow:0 12px 28px #0002;z-index:1000;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top;transition:.16s}.dropdown.open .drop-menu{opacity:1;visibility:visible;transform:none}.drop-option{width:100%;border:0;background:transparent;color:#222;text-align:left;padding:11px 12px;border-radius:8px;font-size:16px;cursor:pointer;margin:0}.drop-option:hover{background:#eef9fe;color:#078fc7}.drop-option.selected{background:#13a9e8;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foldrow{display:flex;gap:8px;align-items:center}.foldrow input{flex:1;text-align:center}.foldbtn{width:52px;padding:12px 8px;margin:0;font-size:22px}.checkrow{display:flex;align-items:center;gap:10px;margin-top:9px;padding:10px 12px;background:#f7f7f7;border-radius:10px;font-weight:700}.checkrow input{width:20px;height:20px;margin:0}.button{border:0;background:#111;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.button:hover{transform:translateY(-1px);box-shadow:0 5px 14px #0002}.price-card{background:linear-gradient(135deg,#fff,#eaf8ff);border:1px solid #b9e6f8;overflow:hidden;padding:18px}.price-title{font-size:14px;color:#148bb7;font-weight:800;text-transform:uppercase;letter-spacing:1px}.result{font-size:48px;font-weight:950;line-height:1.05;margin-top:5px;color:#078fc7;text-shadow:0 2px 8px #078fc72a;transition:transform .2s}.result.bump{animation:priceBump .3s ease}@keyframes priceBump{50%{transform:scale(1.08)}100%{transform:scale(1)}}.price-badge{float:right;margin-top:-35px;background:#13a9e8;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.cost-row{background:#fff;border:1px solid #e8edf0;border-radius:11px;padding:10px 11px;display:flex;justify-content:space-between;gap:8px}.cost-name{font-size:12px;color:#66727b}.cost-value{font-weight:800;font-size:13px}.calc-status{margin-top:10px;font-size:11px;color:#6d7880;text-align:right}.green{background:#087f5b}.wa{background:#168c45}.copy{white-space:pre-wrap;background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7}.hint{font-size:12px;color:#777;margin-top:5px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#087f5b;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9999}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:420px){.grid{grid-template-columns:1fr}.result{font-size:44px}}</style></head><body><div class="app"><div class="head"><div class="logo">M <b>&</b> K Enterprise</div><div class="sub">Poly Bag Price Calculator</div></div><div class="card"><div class="grid"><div><label>Width (inch)</label><input id="w" type="number" value="14" step=".01" min="0"></div><div><label>Length (inch)</label><input id="l" type="number" value="18" step=".01" min="0"></div><div><label>Thickness (mm)</label><input id="t" type="number" value="17" step=".01" min="0"></div><div><label>Folding (inch)</label><div class="foldrow"><button class="foldbtn" id="minusFold" type="button">−</button><input id="fold" type="number" value="3" step="1" min="0" max="6"><button class="foldbtn" id="plusFold" type="button">+</button></div><div class="hint">Folding: 3, 4, 5, 6 inch অথবা নিজের মতো value দিন</div><div class="checkrow"><input id="noFold" type="checkbox"><span>Folding ছাড়া</span></div></div></div><label>Pound rate (Tk/lb) — editable</label><input id="pound" type="number" value="120" step=".01" min="0"><label>Handle</label><select id="handle"><option value="d">ডি-কাট হেন্ডেল</option><option value="t">তোরা হেন্ডেল</option></select><div id="hb" style="display:none"><label>তোরা হেন্ডেল charge (Tk/pc)</label><input id="hc" type="number" value="0" step=".01" min="0"></div><label>Print</label><select id="print"><option value=".60">১ কালার (উভয় পাশে)</option><option value="1">২ কালার (উভয় পাশে)</option></select><label>Print charge (Tk/pc) — editable</label><input id="pc" type="number" value=".60" step=".01" min="0"><label>Block</label><select id="block"><option value="0">কোনো Block নেই</option><option value="1.50">১ কালার Block</option><option value="1">২ কালার Block</option></select><label>Block charge (Tk/pc) — editable</label><input id="bc" type="number" value="0" step=".01" min="0"><label>Profit (Tk/pc) — editable</label><input id="profit" type="number" value="1" step=".01" min="0"><label>Minimum order (pcs) — editable</label><input id="qty" type="number" value="2000" min="0"><button class="button" id="calcBtn">Calculate Price</button></div><div class="card price-card"><div class="price-title">Selling Price / Piece</div><div class="result" id="price">৳0.00</div><div class="price-badge" id="priceBadge">READY</div><div class="breakdown"><div class="cost-row"><span class="cost-name">Raw Material</span><span class="cost-value" id="rawOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Print</span><span class="cost-value" id="printOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Block</span><span class="cost-value" id="blockOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Handle</span><span class="cost-value" id="handleOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Profit</span><span class="cost-value" id="profitOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Pcs / lb</span><span class="cost-value" id="pplOut">0.00</span></div></div><div class="calc-status" id="calcStatus">Live calculation</div><button class="button green" id="copyBtn">Copy Customer Text</button><button class="button wa" id="waBtn">WhatsApp</button></div><div class="card"><b>Customer Copy</b><div id="customer" class="copy"></div></div></div><div id="toast" class="toast">✓ Text copied successfully</div><script>const $=id=>document.getElementById(id),bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),fmt=x=>Number(x||0).toFixed(2);function calc(){let w=+$('w').value,l=+$('l').value,t=+$('t').value,f=$('noFold').checked?0:+$('fold').value||0,pound=+$('pound').value||0;if(w<=0||l<=0||t<=0){$('price').textContent='৳0.00';return}let ppl=75000/((w+f)*l*t),raw=pound/ppl,pr=+$('pc').value||0,bl=+$('bc').value||0,h=$('handle').value==='t'?+$('hc').value||0:0,profit=+$('profit').value||0,total=raw+pr+bl+h+profit;$('price').textContent='৳'+fmt(total);$('rawOut').textContent='৳'+fmt(raw);$('printOut').textContent='৳'+fmt(pr);$('blockOut').textContent='৳'+fmt(bl);$('handleOut').textContent='৳'+fmt(h);$('profitOut').textContent='৳'+fmt(profit);$('pplOut').textContent=fmt(ppl);$('priceBadge').textContent='LIVE';$('calcStatus').textContent='Updated just now';let r=$('price');r.classList.remove('bump');void r.offsetWidth;r.classList.add('bump');let ft=f===0?'ছাড়া':bn(f)+' ইঞ্চি',ht=$('handle').value==='t'?'তোরা হেন্ডেল':'ডি-কাট হেন্ডেল',pt=$('print').value==='.60'?'১ কালার (উভয় পাশে)':'২ কালার (উভয় পাশে)',qty=Math.max(0,+$('qty').value||0);window.txt=`প্রস্থ/Width=  ${bn(w)} ইঞ্চি\nদৈঘ্য/ length=  ${bn(l)} ইঞ্চি\nগেজেট / Folding=  ${ft}\n${ht}\n${pt}\nসর্বনিম্ন অর্ডার ${bn(qty)} পিস \nথিকনেস= ${bn(t)} mm\n\nদাম = ${bn(fmt(total))} টাকা পার পিস`;$('customer').textContent=window.txt}function setupDropdown(s){let w=document.createElement('div');w.className='dropdown';s.parentNode.insertBefore(w,s);w.appendChild(s);let tr=document.createElement('button');tr.type='button';tr.className='drop-trigger';let m=document.createElement('div');m.className='drop-menu';Array.from(s.options).forEach(o=>{let b=document.createElement('button');b.type='button';b.className='drop-option';b.textContent=o.textContent;b.dataset.v=o.value;b.onclick=()=>{s.value=o.value;s.dispatchEvent(new Event('change'));up();w.classList.remove('open')};m.appendChild(b)});function up(){tr.textContent=s.options[s.selectedIndex].textContent;m.querySelectorAll('.drop-option').forEach(b=>b.classList.toggle('selected',b.dataset.v===s.value))}tr.onclick=()=>{document.querySelectorAll('.dropdown.open').forEach(x=>x!==w&&x.classList.remove('open'));w.classList.toggle('open')};w.append(tr,m);up()}document.querySelectorAll('select').forEach(setupDropdown);document.addEventListener('click',e=>{if(!e.target.closest('.dropdown'))document.querySelectorAll('.dropdown.open').forEach(x=>x.classList.remove('open'))});function showToast(){$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}$('minusFold').onclick=()=>{if(!$('noFold').checked){$('fold').value=Math.max(0,+$('fold').value-1);calc()}};$('plusFold').onclick=()=>{if(!$('noFold').checked){$('fold').value=Math.min(6,+$('fold').value+1);calc()}};$('noFold').onchange=()=>{$('fold').disabled=$('noFold').checked;$('minusFold').disabled=$('noFold').checked;$('plusFold').disabled=$('noFold').checked;if($('noFold').checked)$('fold').value=0;else if(+$('fold').value===0)$('fold').value=3;calc()};$('handle').onchange=()=>{$('hb').style.display=$('handle').value==='t'?'block':'none';calc()};$('print').onchange=()=>{$('pc').value=$('print').value;$('qty').value=$('print').value==='.60'?2000:3000;calc()};$('block').onchange=()=>{$('bc').value=$('block').value;calc()};$('calcBtn').onclick=calc;$('copyBtn').onclick=async()=>{calc();try{await navigator.clipboard.writeText(window.txt);showToast()}catch(e){}};$('waBtn').onclick=()=>{calc();location.href='https://wa.me/?text='+encodeURIComponent(window.txt)};['w','l','t','fold','pound','hc','pc','bc','profit','qty'].forEach(id=>$(id).oninput=calc);calc();</script></body></html>
