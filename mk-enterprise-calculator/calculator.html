<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f5f7"><title>M & K Enterprise Calculator</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}.app{max-width:560px;margin:auto;padding:18px}.head{background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center}.logo{font-size:27px;font-weight:800}.logo b{color:#e11}.sub{opacity:.8;font-size:13px}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 5px 20px #0001}label{display:block;font-weight:700;margin:9px 0 5px}input,select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box;transition:.2s ease}input:focus{outline:none;border-color:#13a9e8;box-shadow:0 0 0 3px #13a9e81f;background:#fbfeff}select{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.dropdown{position:relative;width:100%}.drop-trigger{width:100%;min-height:47px;padding:12px 42px 12px 14px;border:1px solid #d8dee4;border-radius:10px;background:#fff;color:#111;text-align:left;font-size:16px;cursor:pointer;position:relative;transition:.2s ease;box-shadow:0 1px 2px #00000008}.drop-trigger:after{content:'⌄';position:absolute;right:14px;top:50%;transform:translateY(-55%);font-size:21px;font-weight:700;color:#68737d;transition:.2s ease}.dropdown.open .drop-trigger{border-color:#13a9e8;box-shadow:0 0 0 3px #13a9e81f}.dropdown.open .drop-trigger:after{transform:translateY(-45%) rotate(180deg);color:#13a9e8}.drop-trigger:hover{border-color:#13a9e8;box-shadow:0 4px 12px #0000000d}.drop-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #dfe5ea;border-radius:12px;padding:6px;box-shadow:0 12px 28px #0002;z-index:1000;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top;transition:.16s ease}.dropdown.open .drop-menu{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.drop-option{width:100%;border:0;background:transparent;color:#222;text-align:left;padding:11px 12px;border-radius:8px;font-size:16px;cursor:pointer;margin:0;transition:.15s ease}.drop-option:hover{background:#eef9fe;color:#078fc7;transform:none;box-shadow:none}.drop-option.selected{background:#13a9e8;color:#fff;font-weight:700}.drop-option.selected:hover{background:#0d9bd5;color:#fff}.button{border:0;background:#111;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foldrow{display:flex;gap:8px;align-items:center}.foldrow input{flex:1;text-align:center}.foldbtn{width:52px;padding:12px 8px;margin:0;font-size:22px}.checkrow{display:flex;align-items:center;gap:10px;margin-top:9px;padding:10px 12px;background:#f7f7f7;border-radius:10px;font-weight:700}.checkrow input{width:20px;height:20px;margin:0}.price-card{background:linear-gradient(135deg,#fff,#f4fbff);border:1px solid #d9edf7;overflow:hidden}.price-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.price-title{font-size:13px;color:#64727d;font-weight:700;text-transform:uppercase;letter-spacing:.7px}.result{font-size:34px;font-weight:900;line-height:1.1;margin-top:6px;transition:transform .2s ease}.result.bump{animation:priceBump .28s ease}@keyframes priceBump{50%{transform:scale(1.06)}100%{transform:scale(1)}}.price-badge{background:#13a9e8;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.cost-row{background:#fff;border:1px solid #e8edf0;border-radius:11px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.18s ease}.cost-row:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0000000b}.cost-name{font-size:12px;color:#66727b}.cost-value{font-weight:800;font-size:13px}.calc-status{margin-top:10px;font-size:11px;color:#6d7880;text-align:right}.muted{color:#666}.copy{white-space:pre-wrap;background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7}.green{background:#087f5b}.wa{background:#168c45}.hint{font-size:12px;color:#777;margin-top:5px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#087f5b;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9999}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:420px){.grid{grid-template-columns:1fr}.breakdown{grid-template-columns:1fr 1fr}.price-top{align-items:center}.price-badge{font-size:11px;padding:6px 8px}}</style></head><body><div class="app"><div class="head"><div class="logo">M <b>&</b> K Enterprise</div><div class="sub">Poly Bag Price Calculator</div></div><div class="card"><div class="grid"><div><label>Width (inch)</label><input id="w" type="number" value="14" step=".01" min="0"></div><div><label>Length (inch)</label><input id="l" type="number" value="18" step=".01" min="0"></div><div><label>Thickness (mm)</label><input id="t" type="number" value="17" step=".01" min="0"></div><div><label>Folding (inch)</label><div class="foldrow"><button class="foldbtn" id="minusFold" type="button" onclick="changeFold(-1)">−</button><input id="fold" type="number" value="3" step="1" min="0" max="6"><button class="foldbtn" id="plusFold" type="button" onclick="changeFold(1)">+</button></div><div class="hint">Folding: 3, 4, 5, 6 inch অথবা নিজের মতো value দিন</div><div class="checkrow"><input id="noFold" type="checkbox"><span>Folding ছাড়া</span></div></div></div><label>Pound rate (Tk/lb) — editable</label><input id="pound" type="number" value="120" step=".01" min="0"><label>Handle</label><select id="handle"><option value="d">ডি-কাট হেন্ডেল</option><option value="t">তোরা হেন্ডেল</option></select><div id="hb" style="display:none"><label>তোরা হেন্ডেল charge (Tk/pc)</label><input id="hc" type="number" value="0" step=".01" min="0"></div><label>Print</label><select id="print"><option value=".60">১ কালার (উভয় পাশে)</option><option value="1">২ কালার (উভয় পাশে)</option></select><label>Print charge (Tk/pc) — editable</label><input id="pc" type="number" value=".60" step=".01" min="0"><label>Block</label><select id="block"><option value="0">কোনো Block নেই</option><option value="1.50">১ কালার Block</option><option value="1">২ কালার Block</option></select><label>Block charge (Tk/pc) — editable</label><input id="bc" type="number" value="0" step=".01" min="0"><label>Profit (Tk/pc) — editable</label><input id="profit" type="number" value="1" step=".01" min="0"><label>Minimum order (pcs) — editable</label><input id="qty" type="number" value="2000" min="0"><button class="button" onclick="calc()">Calculate Price</button></div><div class="card price-card"><div class="price-top"><div><div class="price-title">Selling Price / Piece</div><div class="result" id="price">৳0.00</div></div><div class="price-badge" id="priceBadge">READY</div></div><div class="breakdown"><div class="cost-row"><span class="cost-name">Raw Material</span><span class="cost-value" id="rawOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Print</span><span class="cost-value" id="printOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Block</span><span class="cost-value" id="blockOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Handle</span><span class="cost-value" id="handleOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Profit</span><span class="cost-value" id="profitOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Pcs / lb</span><span class="cost-value" id="pplOut">0.00</span></div></div><div class="calc-status" id="calcStatus">Live calculation</div><button class="button green" id="copyBtn" onclick="copyText()">Copy Customer Text</button><button class="button wa" onclick="wa()">WhatsApp</button></div><div class="card"><b>Customer Copy</b><div id="customer" class="copy"></div></div></div><div id="toast" class="toast">✓ Text copied successfully</div><script>const $=x=>document.getElementById(x),bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),fmt=x=>Number(x||0).toFixed(2);function changeFold(s){let e=$('fold');if($('noFold').checked)return;let v=parseFloat(e.value);if(!Number.isFinite(v))v=3;e.value=Math.max(0,Math.min(6,v+s));calc()}function syncFoldState(){let o=$('noFold').checked;$('fold').disabled=o;$('minusFold').disabled=o;$('plusFold').disabled=o;if(o)$('fold').value=0;else if(+$('fold').value===0)$('fold').value=3;calc()}function calc(){let w=+$('w').value,l=+$('l').value,t=+$('t').value,f=$('noFold').checked?0:Math.max(0,Math.min(6,+$('fold').value||0)),pound=Math.max(0,+$('pound').value||0);if(w<=0||l<=0||t<=0){$('price').textContent='৳0.00';$('priceBadge').textContent='CHECK INPUT';return}let ppl=75000/((w+f)*l*t),raw=pound/ppl,pr=Math.max(0,+$('pc').value||0),bl=Math.max(0,+$('bc').value||0),h=$('handle').value==='t'?Math.max(0,+$('hc').value||0):0,profit=Math.max(0,+$('profit').value||0),total=raw+pr+bl+h+profit;$('price').textContent='৳'+fmt(total);$('rawOut').textContent='৳'+fmt(raw);$('printOut').textContent='৳'+fmt(pr);$('blockOut').textContent='৳'+fmt(bl);$('handleOut').textContent='৳'+fmt(h);$('profitOut').textContent='৳'+fmt(profit);$('pplOut').textContent=fmt(ppl);$('priceBadge').textContent='LIVE';$('calcStatus').textContent='Updated just now';let r=$('price');r.classList.remove('bump');void r.offsetWidth;r.classList.add('bump');let ft=f===0?'ছাড়া':bn(f)+' ইঞ্চি',ht=$('handle').value==='t'?'তোরা হেন্ডেল':'ডি-কাট হেন্ডেল',pt=$('print').value==='.60'?'১ কালার (উভয় পাশে)':'২ কালার (উভয় পাশে)',qty=Math.max(0,+$('qty').value||0);window.txt=`প্রস্থ/Width=  ${bn(w)} ইঞ্চি\nদৈঘ্য/ length=  ${bn(l)} ইঞ্চি\nগেজেট / Folding=  ${ft}\n${ht}\n${pt}\nসর্বনিম্ন অর্ডার ${bn(qty)} পিস \nথিকনেস= ${bn(t)} mm\n\nদাম = ${bn(fmt(total))} টাকা পার পিস`;$('customer').textContent=window.txt}async function copyText(){calc();try{await navigator.clipboard.writeText(window.txt);showToast();let b=$('copyBtn'),o=b.textContent;b.textContent='✓ Copied Successfully';setTimeout(()=>b.textContent=o,1600)}catch(e){showToast('Copy failed — please try again')}}function showToast(m='✓ Text copied successfully'){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}function wa(){calc();location.href='https://wa.me/?text='+encodeURIComponent(window.txt)}$('handle').onchange=()=>{$('hb').style.display=$('handle').value==='t'?'block':'none';calc()};$('print').onchange=()=>{$('pc').value=$('print').value;$('qty').value=$('print').value==='.60'?2000:3000;calc()};$('block').onchange=()=>{$('bc').value=$('block').value;calc()};$('noFold').onchange=syncFoldState;['w','l','t','fold','pound','hc','pc','bc','profit','qty'].forEach(id=>$(id).addEventListener('input',calc));function setupDropdown(select){let wrap=document.createElement('div');wrap.className='dropdown';select.parentNode.insertBefore(wrap,select);wrap.appendChild(select);let trigger=document.createElement('button');trigger.type='button';trigger.className='drop-trigger';let menu=document.createElement('div');menu.className='drop-menu';Array.from(select.options).forEach(opt=>{let item=document.createElement('button');item.type='button';item.className='drop-option';item.textContent=opt.textContent;item.dataset.value=opt.value;item.onclick=()=>{select.value=opt.value;select.dispatchEvent(new Event('change',{bubbles:true}));updateDropdown();closeDropdown()};menu.appendChild(item)});function updateDropdown(){let opt=select.options[select.selectedIndex];trigger.textContent=opt?opt.textContent:'';menu.querySelectorAll('.drop-option').forEach(i=>i.classList.toggle('selected',i.dataset.value===select.value))}function closeDropdown(){wrap.classList.remove('open')}trigger.onclick=()=>{document.querySelectorAll('.dropdown.open').forEach(d=>{if(d!==wrap)d.classList.remove('open')});wrap.classList.toggle('open')};select.addEventListener('change',updateDropdown);wrap.appendChild(trigger);wrap.appendChild(menu);updateDropdown()}document.querySelectorAll('select').forEach(setupDropdown);document.addEventListener('click',e=>{if(!e.target.closest('.dropdown'))document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'))});calc();</script></body></html>
