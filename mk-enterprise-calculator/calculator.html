<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M & K Enterprise Calculator</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}.app{max-width:560px;margin:auto;padding:18px}.head{background:#d4e6dc;border-radius:18px;padding:20px;text-align:center}.logo{font-size:27px;font-weight:800}.sub{color:#e11;font-size:13px;font-weight:800}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 5px 20px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{min-width:0}.fold-field{grid-column:1/-1}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:flex;align-items:center;gap:8px;font-weight:700;margin:9px 0 5px}.grid label{font-size:13px;gap:5px;white-space:nowrap}.ico{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:#dff1e8;color:#087f5b;font-size:16px;flex:none}.grid .ico{width:24px;height:24px;font-size:13px;border-radius:7px}input,select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}input{font-family:Arial,sans-serif}input:focus{outline:none;border-color:#13a9e8;box-shadow:0 0 0 3px #13a9e81f;background:#fbfeff}select{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.dropdown{position:relative}.drop-trigger{width:100%;min-height:47px;padding:12px 42px 12px 14px;border:1px solid #d8dee4;border-radius:10px;background:#fff;text-align:left;font-size:16px;position:relative}.drop-trigger:after{content:'⌄';position:absolute;right:14px;font-size:21px}.drop-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #dfe5ea;border-radius:12px;padding:6px;box-shadow:0 12px 28px #0002;z-index:1000;display:none}.dropdown.open .drop-menu{display:block}.drop-option{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px}.drop-option.selected{background:#13a9e8;color:#fff;font-weight:700}.foldrow{display:flex;gap:8px;align-items:center}.foldrow input{flex:1;text-align:center;font-size:18px;font-weight:700}.foldbtn{width:60px;padding:15px 10px;margin:0;font-size:25px;background:#000;color:#fff;border-color:#000;border-radius:15px;font-weight:700}.checkrow{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;background:#f7f7f7;border-radius:10px;font-weight:700}.checkrow input{width:20px;height:20px;margin:0}.hint{font-size:12px;color:#777;margin-top:6px}.button{border:0;background:#111;color:#fff;font-weight:700;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #000}.copy-button{background:#0a9f63;box-shadow:0 3px 0 #087a4d}.price-card{background:linear-gradient(135deg,#fff,#eaf8ff);border:1px solid #b9e6f8;padding:18px}.price-title{font-size:14px;color:#148bb7;font-weight:800}.result{font-size:48px;font-weight:950;margin-top:5px;color:#078fc7}.price-badge{float:right;margin-top:-35px;background:#13a9e8;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.cost-row{background:#fff;border:1px solid #e8edf0;border-radius:11px;padding:10px 11px;display:flex;justify-content:space-between}.cost-name{font-size:12px;color:#66727b}.cost-value{font-weight:800;font-size:13px}.copy{white-space:pre-wrap;background:#f7f7f7;border-radius:12px;padding:14px;line-height:1.7;font-weight:700}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#087f5b;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:9999}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:420px){.app{padding:12px}.grid{gap:6px}.grid label{font-size:11px}.grid input{font-size:14px;padding:9px 5px}.result{font-size:44px}.foldbtn{width:56px;padding:13px 8px;font-size:23px}.foldrow{gap:8px}.foldrow input{padding:14px;font-size:17px}.hint{font-size:10px}.checkrow{font-size:12px;padding:10px 12px}.two-col{gap:6px}}</style></head><body><div class="app"><div class="head"><div class="logo">M & K Enterprise</div><div class="sub">Poly Bag Price Calculator</div></div><div class="card"><div class="grid"><div class="field"><label><span class="ico">↔</span>Width</label><input id="w" type="text" inputmode="decimal" value="14"></div><div class="field"><label><span class="ico">↕</span>Length</label><input id="l" type="text" inputmode="decimal" value="18"></div><div class="field"><label><span class="ico">▱</span>Thickness</label><input id="t" type="text" inputmode="decimal" value="17"></div><div class="field fold-field"><label><span class="ico">⛶</span>Folding</label><div class="foldrow"><button class="foldbtn" id="minusFold" type="button">−</button><input id="fold" type="text" inputmode="decimal" value="3"><button class="foldbtn" id="plusFold" type="button">+</button></div><div class="hint">Folding: 3, 4, 5, 6 inch অথবা নিজের মতো value দিন</div><div class="checkrow"><input id="noFold" type="checkbox"><span>Folding ছাড়া</span></div></div></div><label><span class="ico">৳</span>Pound rate (Tk/lb) — editable</label><input id="pound" type="text" inputmode="decimal" value="120"><label><span class="ico">♧</span>Handle</label><select id="handle"><option value="d">ডি-কাট হেন্ডেল</option><option value="t">তোরা হেন্ডেল</option></select><div id="hb" style="display:none"><label>তোরা হেন্ডেল charge (Tk/pc)</label><input id="hc" type="text" inputmode="decimal" value="0"></div><label><span class="ico">●</span>Print</label><select id="print"><option value=".60">১ কালার (উভয় পাশে)</option><option value="1">২ কালার (উভয় পাশে)</option></select><label><span class="ico">≋</span>Print charge (Tk/pc) — editable</label><input id="pc" type="text" inputmode="decimal" value=".60"><label><span class="ico">□</span>Block</label><select id="block"><option value="0">কোনো Block নেই</option><option value="1.50">১ কালার Block</option><option value="1">২ কালার Block</option></select><label><span class="ico">◇</span>Block charge (Tk/pc) — editable</label><input id="bc" type="text" inputmode="decimal" value="0"><div class="two-col"><div><label><span class="ico">▥</span>Profit</label><input id="profit" type="text" inputmode="decimal" value="1"></div><div><label><span class="ico">▤</span>Minimum order</label><input id="qty" type="text" inputmode="numeric" value="2000"></div></div><button class="button" id="calcBtn">Calculate Price</button></div><div class="card price-card"><div class="price-title">Selling Price / Piece</div><div class="result" id="price">৳0.00</div><div class="price-badge" id="priceBadge">READY</div><div class="breakdown"><div class="cost-row"><span class="cost-name">Raw Material</span><span class="cost-value" id="rawOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Print</span><span class="cost-value" id="printOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Block</span><span class="cost-value" id="blockOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Handle</span><span class="cost-value" id="handleOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Profit</span><span class="cost-value" id="profitOut">৳0.00</span></div><div class="cost-row"><span class="cost-name">Pcs / lb</span><span class="cost-value" id="pplOut">0.00</span></div></div><button class="button copy-button" id="copyBtn">▣ Copy Customer Text</button></div><div class="card"><b>Customer Copy</b><div id="customer" class="copy"></div></div></div><div id="toast" class="toast">✓ Text copied successfully</div><script>const $=id=>document.getElementById(id),bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),num=v=>{v=String(v??'').replace(/[০-৯]/g,d=>'0123456789'['০১২৩৪৫৬৭৮৯'.indexOf(d)]).replace(/,/g,'').replace(/٫/g,'.').trim();return parseFloat(v)||0},fmt=x=>Number(x||0).toFixed(2);function calc(){let w=num($('w').value),l=num($('l').value),t=num($('t').value),f=$('noFold').checked?0:num($('fold').value),pound=num($('pound').value);if(w<=0||l<=0||t<=0)return;let ppl=75000/((w+f)*l*t),raw=pound/ppl,pr=num($('pc').value),bl=num($('bc').value),h=$('handle').value==='t'?num($('hc').value):0,profit=num($('profit').value),total=raw+pr+bl+h+profit;$('price').textContent='৳'+fmt(total);$('rawOut').textContent='৳'+fmt(raw);$('printOut').textContent='৳'+fmt(pr);$('blockOut').textContent='৳'+fmt(bl);$('handleOut').textContent='৳'+fmt(h);$('profitOut').textContent='৳'+fmt(profit);$('pplOut').textContent=fmt(ppl);$('priceBadge').textContent='LIVE';let ft=f===0?'ছাড়া':bn(f)+' ইঞ্চি',ht=$('handle').value==='t'?'তোরা হেন্ডেল':'ডি-কাট হেন্ডেল',pt=$('print').value==='.60'?'১ কালার (উভয় পাশে)':'২ কালার (উভয় পাশে)',qty=Math.max(0,num($('qty').value));window.txt=`প্রস্থ/Width=  ${bn(w)} ইঞ্চি\nদৈঘ্য/ length=  ${bn(l)} ইঞ্চি\nগেজেট / Folding=  ${ft}\n${ht}\n${pt}\nসর্বনিম্ন অর্ডার ${bn(qty)} পিস \nথিকনেস= ${bn(t)} mm\n\nদাম = ${bn(fmt(total))} টাকা পার পিস`;$('customer').textContent=window.txt}function setup(s){let w=document.createElement('div');w.className='dropdown';s.parentNode.insertBefore(w,s);w.appendChild(s);let b=document.createElement('button');b.type='button';b.className='drop-trigger';let m=document.createElement('div');m.className='drop-menu';Array.from(s.options).forEach(o=>{let x=document.createElement('button');x.type='button';x.className='drop-option';x.textContent=o.textContent;x.onclick=()=>{s.value=o.value;s.dispatchEvent(new Event('change'));b.textContent=o.textContent;w.classList.remove('open')};m.appendChild(x)});b.textContent=s.options[s.selectedIndex].textContent;b.onclick=()=>w.classList.toggle('open');w.append(b,m)}document.querySelectorAll('select').forEach(setup);$('minusFold').onclick=()=>{if(!$('noFold').checked){$('fold').value=Math.max(0,num($('fold').value)-1);calc()}};$('plusFold').onclick=()=>{if(!$('noFold').checked){$('fold').value=Math.min(6,num($('fold').value)+1);calc()}};$('noFold').onchange=()=>{$('fold').disabled=$('noFold').checked;$('minusFold').disabled=$('noFold').checked;$('plusFold').disabled=$('noFold').checked;if($('noFold').checked)$('fold').value='0';else if(num($('fold').value)===0)$('fold').value='3';calc()};$('handle').onchange=()=>{$('hb').style.display=$('handle').value==='t'?'block':'none';calc()};$('print').onchange=()=>{$('pc').value=$('print').value;$('qty').value=$('print').value==='.60'?'2000':'3000';calc()};$('block').onchange=()=>{$('bc').value=$('block').value;calc()};$('calcBtn').onclick=calc;$('copyBtn').onclick=async()=>{calc();try{await navigator.clipboard.writeText(window.txt);$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}catch(e){}};['w','l','t','fold','pound','hc','pc','bc','profit','qty'].forEach(id=>$(id).addEventListener('input',calc));calc();</script></body></html>
