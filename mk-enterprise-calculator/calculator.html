<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M & K Enterprise Calculator</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}.app{max-width:560px;margin:auto;padding:8px}.head{background:#d4e6dc;border-radius:14px;padding:10px;text-align:center}.logo{font-size:22px;font-weight:800}.sub{color:#e11;font-size:11px;font-weight:800}.card{background:#fff;border-radius:12px;padding:10px;margin-top:8px;box-shadow:0 3px 12px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:12px;margin:4px 0 3px}input,select,button{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px}button{border:0;background:#111;color:#fff;font-weight:700;margin-top:7px}.foldrow{display:grid;grid-template-columns:34px 1fr 34px;gap:4px}.foldbtn{margin:0;padding:6px;font-size:18px}.checkrow{display:flex;align-items:center;gap:6px;margin-top:4px;padding:5px 7px;background:#f7f7f7;border-radius:7px;font-size:12px;font-weight:700}.checkrow input{width:17px;height:17px}.hint{font-size:9px;color:#777;margin-top:2px}.result{font-size:34px;font-weight:900;color:#078fc7;margin:2px 0 6px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cost{background:#fff;border:1px solid #e8edf0;border-radius:7px;padding:6px;display:flex;justify-content:space-between}.name{font-size:9px;color:#66727b}.val{font-size:10px;font-weight:800}.green{background:#0a9f63}.wa{background:#168c45}.copy{white-space:pre-wrap;background:#f7f7f7;border-radius:8px;padding:9px;line-height:1.5;font-size:12px;font-weight:700}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#087f5b;color:#fff;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:700;opacity:0;transition:.2s}.toast.show{opacity:1}</style></head><body><div class="app"><div class="head"><div class="logo">M & K Enterprise</div><div class="sub">Poly Bag Price Calculator</div></div><div class="card"><div class="grid"><div><label>Width (inch)</label><input id="w" type="number" value="14" step=".01" min="0"></div><div><label>Length (inch)</label><input id="l" type="number" value="18" step=".01" min="0"></div><div><label>Thickness (mm)</label><input id="t" type="number" value="17" step=".01" min="0"></div><div><label>Folding (inch)</label><div class="foldrow"><button class="foldbtn" id="minus">−</button><input id="fold" type="number" value="3" step="1" min="0" max="6"><button class="foldbtn" id="plus">+</button></div><div class="hint">3, 4, 5, 6 inch বা নিজের value</div><div class="checkrow"><input id="noFold" type="checkbox"><span>Folding ছাড়া</span></div></div><div><label>Pound rate (Tk/lb)</label><input id="pound" type="number" value="120" step=".01" min="0"></div><div><label>Handle</label><select id="handle"><option value="d">ডি-কাট হেন্ডেল</option><option value="t">তোরা হেন্ডেল</option></select></div><div id="hb" style="display:none"><label>তোরা হেন্ডেল charge</label><input id="hc" type="number" value="0" step=".01" min="0"></div><div><label>Print</label><select id="print"><option value=".60">১ কালার (উভয় পাশে)</option><option value="1">২ কালার (উভয় পাশে)</option></select></div><div><label>Print charge</label><input id="pc" type="number" value=".60" step=".01" min="0"></div><div><label>Block</label><select id="block"><option value="0">কোনো Block নেই</option><option value="1.50">১ কালার Block</option><option value="1">২ কালার Block</option></select></div><div><label>Block charge</label><input id="bc" type="number" value="0" step=".01" min="0"></div><div><label>Profit (Tk/pc)</label><input id="profit" type="number" value="1" step=".01" min="0"></div><div><label>Minimum order</label><input id="qty" type="number" value="2000" min="0"></div><div class="full"><button id="calc">Calculate Price</button></div></div></div><div class="card"><div>Price per piece</div><div class="result" id="price">৳0.00</div><div class="breakdown"><div class="cost"><span class="name">Raw</span><span class="val" id="raw">৳0.00</span></div><div class="cost"><span class="name">Print</span><span class="val" id="po">৳0.00</span></div><div class="cost"><span class="name">Block</span><span class="val" id="bo">৳0.00</span></div><div class="cost"><span class="name">Handle</span><span class="val" id="ho">৳0.00</span></div><div class="cost"><span class="name">Profit</span><span class="val" id="pro">৳0.00</span></div><div class="cost"><span class="name">Pcs/lb</span><span class="val" id="ppl">0.00</span></div></div><button class="green" id="copy">Copy Customer Text</button><button class="wa" id="wa">WhatsApp</button></div><div class="card"><b>Customer Copy</b><div id="customer" class="copy"></div></div></div><div id="toast" class="toast">✓ Text copied successfully</div><script>const $=id=>document.getElementById(id),bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),fmt=x=>Number(x||0).toFixed(2);function calc(){let w=+$('w').value,l=+$('l').value,t=+$('t').value,f=$('noFold').checked?0:+$('fold').value||0,p=+$('pound').value||0;if(w<=0||l<=0||t<=0)return;$('fold').disabled=$('noFold').checked;$('minus').disabled=$('noFold').checked;$('plus').disabled=$('noFold').checked;let ppl=75000/((w+f)*l*t),raw=p/ppl,pr=+$('pc').value||0,bl=+$('bc').value||0,h=$('handle').value==='t'?+$('hc').value||0:0,profit=+$('profit').value||0,total=raw+pr+bl+h+profit;$('price').textContent='৳'+fmt(total);$('raw').textContent='৳'+fmt(raw);$('po').textContent='৳'+fmt(pr);$('bo').textContent='৳'+fmt(bl);$('ho').textContent='৳'+fmt(h);$('pro').textContent='৳'+fmt(profit);$('ppl').textContent=fmt(ppl);let ft=f===0?'ছাড়া':bn(f)+' ইঞ্চি',ht=$('handle').value==='t'?'তোরা হেন্ডেল':'ডি-কাট হেন্ডেল',pt=$('print').value==='.60'?'১ কালার (উভয় পাশে)':'২ কালার (উভয় পাশে)',q=Math.max(0,+$('qty').value||0);window.txt=`প্রস্থ/Width=  ${bn(w)} ইঞ্চি\nদৈঘ্য/ length=  ${bn(l)} ইঞ্চি\nগেজেট / Folding=  ${ft}\n${ht}\n${pt}\nসর্বনিম্ন অর্ডার ${bn(q)} পিস \nথিকনেস= ${bn(t)} mm\n\nদাম = ${bn(fmt(total))} টাকা পার পিস`;$('customer').textContent=window.txt}function toast(){let x=$('toast');x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}$('minus').onclick=()=>{if(!$('noFold').checked){$('fold').value=Math.max(0,+$('fold').value-1);calc()}};$('plus').onclick=()=>{if(!$('noFold').checked){$('fold').value=Math.min(6,+$('fold').value+1);calc()}};$('noFold').onchange=()=>{if(!$('noFold').checked&&+$('fold').value===0)$('fold').value=3;calc()};$('handle').onchange=()=>{$('hb').style.display=$('handle').value==='t'?'block':'none';calc()};$('print').onchange=()=>{$('pc').value=$('print').value;$('qty').value=$('print').value==='.60'?2000:3000;calc()};$('block').onchange=()=>{$('bc').value=$('block').value;calc()};$('calc').onclick=calc;$('copy').onclick=async()=>{calc();try{await navigator.clipboard.writeText(window.txt);toast()}catch(e){}};$('wa').onclick=()=>{calc();location.href='https://wa.me/?text='+encodeURIComponent(window.txt)};['w','l','t','fold','pound','hc','pc','bc','profit','qty'].forEach(id=>$(id).addEventListener('input',calc));calc();</script></body></html>
